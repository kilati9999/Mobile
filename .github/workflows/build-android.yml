name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Giải phóng dung lượng ổ đĩa
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
	  packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cài dependencies
        run: npm ci

      - name: Build
        run: |
          EXT=apk
          if [ "${{ inputs.profile }}" = "production" ]; then EXT=aab; fi
          eas build --platform android \
            --profile ${{ inputs.profile }} \
            --local --non-interactive \
            --output ./build/app.$EXT

      - name: Upload file build
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.profile }}
          path: build/